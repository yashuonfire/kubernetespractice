replicaCount: 2
image:
repository: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/myapp
tag: "latest"
pullPolicy: IfNotPresent
service:
type: LoadBalancer
port: 80
targetPort: 3000
resources:
limits:
cpu: 200m
memory: 256Mi
requests:
cpu: 100m
memory: 128Mi
autoscaling:
enabled: true
minReplicas: 2
maxReplicas: 5
targetCPUUtilizationPercentage: 70
health:
livenessPath: /health
readinessPath: /health
